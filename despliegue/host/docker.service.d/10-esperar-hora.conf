# Docker no arranca hasta que el reloj del host esté sincronizado de verdad (P-056).
#
# El Pi no tiene RTC: al encender, el reloj arranca con la hora guardada al apagar
# (atrasado tanto como estuvo apagado) y salta a la hora real a los ~37 s. Si los
# contenedores arrancan antes, el scheduler, hoy_mexico(), los registros y TLS ven
# una hora falsa durante esos segundos.
#
# Ojo: esto NO resuelve el PGRST303 «JWT issued at future» del 17-sep. Con la llave
# sb_secret_ el JWT lo acuña Supabase con su propio reloj; la causa probable es un
# desfase dentro de Supabase (revisión de backend, 27-oct).
#
# Habilitar systemd-time-wait-sync.service NO basta: docker.service solo se ordena
# después de time-set.target (hora aproximada). Este drop-in lo ordena después de
# time-sync.target, que se alcanza cuando systemd-time-wait-sync confirma la sincronía.
#
# Se instala con scripts/preparar_hora_host.sh. Ruta en el host:
#   /etc/systemd/system/docker.service.d/10-esperar-hora.conf
[Unit]
Wants=time-sync.target
After=time-sync.target
