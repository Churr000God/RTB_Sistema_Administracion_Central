# Tope a la espera de sincronía (P-056).
#
# De fábrica systemd-time-wait-sync espera para siempre (TimeoutStartSec=infinity).
# Con el drop-in de docker.service, si no hay internet al encender, Docker no arrancaría nunca.
# Con este tope, a los 3 min la unidad falla, time-sync.target se alcanza igual y Docker
# arranca (con la hora que haya). Queda en el journal como unidad fallida para revisarlo.
#
# 3 min: en el Pi de pruebas la primera sincronía tarda ~37 s tras encender (boot del 26-oct).
# Un tope mayor solo alarga la caída sin red antes de arrancar igual con la hora vieja.
#
# Ruta en el host:
#   /etc/systemd/system/systemd-time-wait-sync.service.d/10-tope-espera.conf
[Service]
TimeoutStartSec=3min
