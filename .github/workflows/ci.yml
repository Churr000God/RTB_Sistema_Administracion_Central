name: CI

# Sólo validación (backend + frontend) en cada push/PR. Sin pasos de deploy.
# Los tests no requieren credenciales de Supabase reales: todos los routers
# que llaman a get_service_client/get_caller_client se prueban con
# dependency_overrides (mocks), y el frontend mockea supabaseClient/apiClient
# en cada test — ver backend/tests/*.py y frontend/src/**/*.test.tsx.

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Correr pytest
        run: uv run pytest

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr vitest
        run: npm test
