[project]
name = "scj-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "supabase>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.3.0",
  "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]
