# SCJ — sirve el bundle de react-router en modo SPA: cualquier ruta que no sea
# un archivo real cae a index.html, para que el enrutado del lado del cliente
# resuelva /personas/:id, /completar-invitacion, etc. sin dar 404 al recargar.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
